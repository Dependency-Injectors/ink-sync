services:
  postgres:
    image: postgres:16-alpine
    container_name: ink-sync-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inksync
    ports:
      - "5434:5432"  # Exposed for local development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ink-sync-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/inksync
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      PORT: 3000
    ports:
      - "3001:3000" # Exposed for nginx reverse proxy
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Frontend is served via nginx at /ink/ path
        VITE_API_URL: https://slpersonal.ddns.net/ink/api
        VITE_WS_URL: wss://slpersonal.ddns.net/ink/ws
    container_name: ink-sync-frontend
    ports:
      - "81:80"
    depends_on:
      - backend

volumes:
  postgres_data:
